<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS</title>
    <!-- 3 - Interno -->

    <style>
      h1 {
        color: purple;
      }
      p {
        color: gold;
        font-size: 20px;
        }
    </style>

    <!-- 4 - External CSS -->
    <!-- cascading style sheets -->
    <link rel="stylesheet" href="css/Style.css" />
    <link rel="stylesheet" href="css/Lists.css" />

  </head>
  <body>
    <!--
    Maneiras de adicionar CSS
    - Inline: Como atributo
    - Interno: Na tag Head
    - Externo: Arquivo importado [Recomendado]

    Anatomia
     Tag: Valor;
    -->

    <!-- 1 - Inline CSS -->
    <!-- - Usa o atributo style direto no elemento -->
    <!-- - Não é recomendado -->

    <h1 style="color: red">Hello World</h1>
    <h1 style="color: blueviolet">Bye</h1>

    <!-- 2 - Multiplas regras -->
    <h1
      style="color: blueviolet; font-size: 50px; border-bottom: 1px solid red">
      Mudar cor e tamanho da fonte
    </h1>

    <!-- 3 - Internal CSS -->
    <!-- - Usa a tag style dentro do head -->
    <!-- - Não é recomendado -->
    <h1>Internal CSS</h1>

    <p>Eu fui estilizado pelo CSS interno</p>
    <p>Eu tambem fui estilizado pelo CSS interno</p>

    <!-- 4 - External CSS -->
    <!-- cascading style sheets -->
    <h3> Meu titulo verde </h3>

    <!-- 5 - Ordem de precedência -->
    <!-- Inline > Interno > Externo -->
    <!-- No entanto se o Externo for importado por ultimo ele tem precedência -->

    <p>Eu sou dourado</p>
    <p style="color: red">Eu sou vermelho</p>

    <!-- 6 - multiple files -->
    <!-- - Pode-se importar varios arquivos CSS -->
    <h2>Lista de compras</h2>
    <ul>
      <li>Arroz</li>
      <li>Feijão</li>
      <li>Macarrão</li> 
    </ul>
    </body>
</html>
